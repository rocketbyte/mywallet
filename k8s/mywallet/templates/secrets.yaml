apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mywallet.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mywallet.labels" . | nindent 4 }}
type: Opaque
stringData:
  # MongoDB credentials
  MONGODB_ROOT_PASSWORD: {{ .Values.secrets.mongodb.rootPassword | quote }}

  # Gmail OAuth credentials
  GMAIL_CLIENT_ID: {{ .Values.secrets.gmail.clientId | quote }}
  GMAIL_CLIENT_SECRET: {{ .Values.secrets.gmail.clientSecret | quote }}
  GMAIL_REFRESH_TOKEN: {{ .Values.secrets.gmail.refreshToken | quote }}

  # OpenAI API credentials
  OPENAI_API_KEY: {{ .Values.secrets.openai.apiKey | quote }}

  # Supabase / Prisma credentials (optional — managed externally via kubectl)
  # Apply with: kubectl patch secret mywallet-secrets -n wallet --type merge \
  #   -p '{"stringData":{"DATABASE_URL":"...","DIRECT_URL":"..."}}'
  {{- if .Values.secrets.supabase }}
  DATABASE_URL: {{ .Values.secrets.supabase.databaseUrl | quote }}
  DIRECT_URL: {{ .Values.secrets.supabase.directUrl | quote }}
  {{- end }}

  # Cloudflare Workers AI credentials (optional — managed externally via kubectl)
  {{- if .Values.secrets.cloudflare }}
  CLOUDFLARE_API_TOKEN: {{ .Values.secrets.cloudflare.apiToken | quote }}
  CLOUDFLARE_API_BASE: {{ .Values.secrets.cloudflare.apiBase | quote }}
  {{- end }}

  # MongoDB connection string (computed)
  MONGODB_URI: {{ include "mywallet.mongodb.connectionString" . | quote }}
