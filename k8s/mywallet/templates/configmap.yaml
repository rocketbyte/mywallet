apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mywallet.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mywallet.labels" . | nindent 4 }}
data:
  # Node environment
  NODE_ENV: {{ .Values.backend.env.NODE_ENV | quote }}

  # Logging
  LOG_LEVEL: {{ .Values.backend.env.LOG_LEVEL | quote }}

  # Backend API port
  PORT: {{ .Values.backend.env.PORT | quote }}

  # CORS allowlist (comma-separated frontend origins)
  CORS_ALLOWED_ORIGINS: {{ .Values.app.cors.allowedOrigins | quote }}

  # MongoDB configuration
  MONGODB_HOST: {{ include "mywallet.mongodb.fullname" . | quote }}
  MONGODB_PORT: {{ .Values.mongodb.service.port | quote }}
  MONGODB_DATABASE: {{ .Values.mongodb.auth.database | quote }}
  MONGODB_USERNAME: {{ .Values.mongodb.auth.rootUsername | quote }}

  # Temporal configuration
  TEMPORAL_ADDRESS: {{ .Values.temporal.address | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.temporal.namespace | quote }}
  TEMPORAL_TASK_QUEUE: {{ .Values.temporal.taskQueue | quote }}

  # Gmail configuration
  GMAIL_PUBSUB_TOPIC: {{ .Values.app.gmail.pubSubTopic | quote }}
  GMAIL_REDIRECT_URI: {{ .Values.app.gmail.redirectUri | quote }}

  # AI configuration — all calls routed through LiteLLM gateway (llm namespace)
  LITELLM_BASE_URL: {{ .Values.app.ai.litellmBaseUrl | quote }}
  OPENAI_MODEL: {{ .Values.app.ai.model | quote }}
  # Chat-only override; falls back to OPENAI_MODEL when unset.
  CHAT_MODEL: {{ .Values.app.ai.chatModel | quote }}

  # DB provider — 'mongodb' or 'prisma' (Supabase)
  # Credentials (DATABASE_URL, DIRECT_URL) are in the secret
  DB_PROVIDER: {{ .Values.app.db.provider | quote }}
