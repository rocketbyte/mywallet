{{- if .Values.recurringWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mywallet.fullname" . }}-recurring-worker
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mywallet.worker.labels" . | nindent 4 }}
    app.kubernetes.io/component: recurring-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: recurring-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recurring-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.worker.securityContext | nindent 8 }}
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "mywallet.mongodb.fullname" . }} {{ .Values.mongodb.service.port }}; do
                echo "MongoDB unavailable - sleeping"; sleep 2
              done
              echo "MongoDB ready"
        - name: wait-for-temporal
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z temporal-frontend.rocket.svc.cluster.local 7233; do
                echo "Temporal unavailable - sleeping"; sleep 2
              done
              echo "Temporal ready"
      containers:
        - name: recurring-worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["node", "packages/temporal-worker/dist/recurring-worker.js"]
          envFrom:
            - configMapRef:
                name: {{ include "mywallet.fullname" . }}-config
            - secretRef:
                name: {{ include "mywallet.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.recurringWorker.resources | nindent 12 }}
{{- end }}
