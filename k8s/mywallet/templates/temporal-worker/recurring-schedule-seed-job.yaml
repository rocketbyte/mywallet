{{- if .Values.recurringWorker.enabled }}
# Post-install / post-upgrade hook: (re)registers the SINGLE global daily
# recurring-transactions Temporal Schedule, in-cluster, on every deploy.
#
# No-duplicate guarantee: the seed upserts a fixed scheduleId
# (RECURRING_CONFIG.SCHEDULE_ID), so re-running only keeps the one schedule in
# sync — it never creates a second cron. `hook-delete-policy: before-hook-creation`
# also removes the previous hook Job before creating a new one, so Job objects
# never pile up either.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mywallet.fullname" . }}-recurring-schedule-seed
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mywallet.worker.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  # Bound the whole hook (across retries) so it always reaches a terminal state
  # well before Helm's hook wait — a stuck attempt fails the release fast and
  # clearly instead of hanging with an opaque "timed out waiting for the
  # condition". Each individual attempt is bounded by the pod deadline below.
  activeDeadlineSeconds: 480
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recurring-schedule-seed
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      # Per-attempt cap: bounds the init wait + seed run so no single pod can
      # block indefinitely.
      activeDeadlineSeconds: 150
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-temporal
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # Bounded wait: give the frontend up to ~90s to open its port,
              # then give up so the pod fails fast and the Job can retry, rather
              # than looping forever and stalling the whole release.
              i=0
              until nc -z temporal-frontend.rocket.svc.cluster.local 7233; do
                i=$((i+1))
                if [ "$i" -ge 45 ]; then
                  echo "Temporal still unavailable after $((i*2))s - giving up"; exit 1
                fi
                echo "Temporal unavailable - sleeping"; sleep 2
              done
              echo "Temporal ready"
      containers:
        - name: seed
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["node", "packages/backend-apis/dist/scripts/ensure-recurring-schedule.js"]
          envFrom:
            - configMapRef:
                name: {{ include "mywallet.fullname" . }}-config
            - secretRef:
                name: {{ include "mywallet.fullname" . }}-secrets
{{- end }}
