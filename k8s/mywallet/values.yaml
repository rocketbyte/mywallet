# MyWallet Helm Chart Values

# Global configuration
global:
  namespace: wallet
  domain: wallet.rotbyte.com
  storageClass: local-path

  # Node selector for Raspberry Pi cluster
  nodeSelector:
    kubernetes.io/arch: arm64

  # Image pull secrets
  imagePullSecrets:
    - name: ghcr-secret

# External Temporal configuration (existing in rocket namespace)
temporal:
  external: true
  address: "temporal-frontend.rocket.svc.cluster.local:7233"
  namespace: "mywallet"
  taskQueue: "email-processing-queue"

# Backend API configuration
backend:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/rocketbyte/mywallet-backend-api
    tag: "dev"
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    hosts:
      - host: wallet.rotbyte.com
        paths:
          - path: /api
            pathType: Prefix
          - path: /docs
            pathType: Prefix
    tls: []

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # Health check configuration
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # Environment variables
  env:
    NODE_ENV: production
    PORT: "3000"
    LOG_LEVEL: info

# Temporal Worker configuration
worker:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/rocketbyte/mywallet-temporal-worker
    tag: "dev"
    pullPolicy: Always

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # Environment variables
  env:
    NODE_ENV: production
    LOG_LEVEL: info
    # Cap V8 old space below the cgroup limit so GC kicks in before OOMKill
    NODE_OPTIONS: "--max-old-space-size=768"

# Pipeline Worker — separate pod for AI extraction (serial, 1 task at a time)
pipelineWorker:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Recurring-transactions worker (monthly copy job, recurring-queue).
recurringWorker:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# MongoDB configuration
mongodb:
  enabled: true

  image:
    repository: mongo
    tag: "4.4.18"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 27017

  auth:
    rootUsername: admin
    database: mywallet
    # rootPassword is set in values-secrets.yaml

  persistence:
    enabled: true
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 10Gi

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999

  # MongoDB configuration
  config:
    # Additional MongoDB configuration can be added here
    storageEngine: wiredTiger

# Application configuration
app:
  # CORS — comma-separated allowlist of frontend origins permitted to make
  # cross-origin browser requests. Firebase Hosting serves the app from both
  # the .web.app and .firebaseapp.com origins, so both are listed.
  cors:
    allowedOrigins: "https://mintly-3f408.web.app,https://mintly-3f408.firebaseapp.com"

  # Gmail configuration
  gmail:
    pubSubTopic: "projects/mywallet-481322/topics/gmail-notifications"
    redirectUri: "https://wallet.rotbyte.com/api/auth/gmail/callback"
    # OAuth credentials are set in values-secrets.yaml

  # AI configuration — routed through LiteLLM gateway in the llm namespace
  ai:
    litellmBaseUrl: "http://litellm.llm.svc.cluster.local:4000/v1"
    model: "cf/llama-3.1-8b-instruct"  # Worker pipeline. Must match a model_name in llm-platform/apps/litellm/manifests/configmap.yaml
    chatModel: "gemini-2.5-flash-lite"  # Chat endpoint only. Same constraint — must be a model_name on the gateway.

  # DB provider — 'mongodb' | 'prisma' (Supabase)
  # DATABASE_URL and DIRECT_URL are managed via kubectl in the secret (never committed)
  db:
    provider: "mongodb"

# Labels to apply to all resources
labels:
  app.kubernetes.io/name: mywallet
  app.kubernetes.io/instance: mywallet
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/managed-by: Helm
