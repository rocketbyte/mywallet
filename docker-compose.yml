version: '3.8'

services:
  # PostgreSQL for Temporal Server
  postgresql:
    image: postgres:15-alpine
    container_name: mywallet-postgres
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mywallet-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U temporal" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporal Server
  temporal:
    image: temporalio/auto-setup:1.22.4
    container_name: mywallet-temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
    ports:
      - "7233:7233"
    networks:
      - mywallet-network
    healthcheck:
      test: [ "CMD", "tctl", "--address", "temporal:7233", "workflow", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:2.21.3
    container_name: mywallet-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - mywallet-network

  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: mywallet-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: mywallet
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - mywallet-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # LiteLLM AI Gateway Proxy
  # All AI calls from the worker are routed through this service.
  # The worker points LITELLM_BASE_URL=http://litellm:4000/v1
  # and LiteLLM routes to the configured provider (OpenAI, Ollama, Anthropic, etc.)
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: mywallet-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-mywallet-local}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama.llm.svc.cluster.local:11434}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_API_BASE=${CLOUDFLARE_API_BASE}
      - LITELLM_DATABASE_URL=${LITELLM_DATABASE_URL}
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - GROQ_API_KEY=${GROQ_API_KEY}
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1" ]
    networks:
      - mywallet-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/health/liveliness" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  mywallet-network:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
